ts="260,604.1797,250,608.1797,260,612.1797,256,608.1797" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="254" x2="392" y1="608.1797" y2="608.1797"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="18" x="266" y="603.1138">Lỗi</text><polygon fill="#A80036" points="77,633.3125,67,637.3125,77,641.3125,73,637.3125" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="71" x2="248" y1="637.3125" y2="637.3125"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="159" x="83" y="632.2466">Hiển thị lỗi; có nút thử lại</text><!--MD5=[c47ba8b1f45e84b80fe5c1060371ae97]
@startuml
skinparam backgroundColor white
skinparam defaultFontName DejaVu Sans
skinparam shadowing false
skinparam activityBackgroundColor #EDF5FA
skinparam sequenceParticipantBackgroundColor #EDF5FA
skinparam usecaseBackgroundColor #EDF5FA
title Hình 3.3 — UC003 Xem chi tiết Load
actor "Người dùng" as U
boundary "LoadShow" as F
control "dataProvider" as P
control "LoadController" as C
control "LoadService" as S
participant "LoadRepository" as R
database "PostgreSQL" as DB
U -> F : Mở chi tiết
F -> P : useShow(loads, id)
P -> C : GET /api/loads/{id}
C -> S : getById(id)
S -> R : findById(id)
R -> DB : Truy vấn
DB - -> R : Load hoặc rỗng
alt Có Load
 S -> S : LoadMapper.toView(load)
 S - -> C : LoadView
 C - -> P : ApiResponse
 P - -> F : Dữ liệu
 F - -> U : Hiển thị chi tiết
else Không tìm thấy hoặc yêu cầu lỗi
 S - -> C : ResourceNotFoundException
 C - -> P : Lỗi
 P - -> F : Lỗi
 F - -> U : Hiển thị lỗi; có nút thử lại
end
@enduml

