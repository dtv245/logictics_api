text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="230" x="83" y="689.3794">Trạng thái quyền hoặc chờ thông tin</text><path d="M222,714.4453 L222,739.4453 L655,739.4453 L655,724.4453 L645,714.4453 L222,714.4453 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M645,714.4453 L645,724.4453 L655,724.4453 L645,714.4453 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="DejaVu Sans" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="412" x="228" y="731.5122">Lỗi truy vấn được chuyển cho bảng; 403 hiển thị ForbiddenState.</text><!--MD5=[04a03b1aa0ca14fbb7af26a2209e1ca7]
@startuml
skinparam backgroundColor white
skinparam defaultFontName DejaVu Sans
skinparam shadowing false
title Hình 3.10 — UC008 Xem chứng từ của Load
actor "Người dùng" as U
boundary "LoadShow / LoadDocumentsPanel" as F
control "dataProvider" as P
control "DocumentController" as C
control "DocumentService" as S
participant "DocumentRepository" as R
database "PostgreSQL" as D
U -> F : Chọn tab chứng từ
F -> F : Kiểm tra quyền, tenant và loadId
alt Có quyền và đủ thông tin
 F -> P : useList(documents, loadId, page)
 P -> C : GET /api/documents?loadId=&page=&pageSize=
 C -> S : search(type, status, loadId, ...)
 S -> S : QuerySortPolicy.sort; PaginationValidator.pageRequest
 S -> R : search(..., pageable)
 R -> D : Truy vấn document theo loadId
 D - -> R : Trang Document
 S -> S : DocumentView.from(document, expiryCalculator)
 S - -> C : PagedResponse<DocumentView>
 C - -> P : ApiResponse
 P - -> F : Trang dữ liệu
 F - -> U : Hiển thị bảng
 opt Còn trang kế tiếp
  F -> P : getList trang kế tiếp để nạp trước
 end
else Không đủ quyền hoặc thông tin
 F - -> U : Trạng thái quyền hoặc chờ thông tin
end
note over F,P : Lỗi truy vấn được chuyển cho bảng; 403 hiển thị ForbiddenState.
@enduml

