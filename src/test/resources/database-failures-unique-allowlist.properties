# Exact PostgreSQL names after ALL tenant migrations; no table/prefix/wildcard exclusions.
# Every new unique index is reviewed, including legacy tables without current CRUD APIs.
# Primary keys are generated record identities and are excluded by the catalog query.
# Do not exempt a user-entered CRUD identity merely to make this test pass.

# V1 baseline tables with no current create/update CRUD controller.
ix_ai_dispatch_sessions_number=V1: Legacy AI dispatch session identity; no current CRUD controller for this table.
ix_api_keys_key_hash=V1: Generated API credential hash; no current API-key CRUD controller or user-entered identity field.
ix_customer_users_customer_id_user_id=V1: Legacy customer-user association identity; no current association CRUD controller.
ix_driver_hos_statuses_employee_id=V1: One HOS projection per employee; no current HOS CRUD controller.
ix_driver_licenses_employee_id_license_number_issuing_country=V1: Legacy driver-license composite identity; no current license create/update controller.
ix_eld_driver_mappings_provider_type_employee_id=V1: Internal ELD employee-provider association; no current mapping CRUD controller.
ix_eld_driver_mappings_provider_type_external_driver_id=V1: External ELD driver identity; no current mapping CRUD controller.
ix_eld_provider_configurations_provider_type=V1: Legacy ELD configuration singleton per provider; no current configuration CRUD controller.
ix_eld_vehicle_mappings_provider_type_external_vehicle_id=V1: External ELD vehicle identity; no current mapping CRUD controller.
ix_eld_vehicle_mappings_provider_type_truck_id=V1: Internal ELD truck-provider association; no current mapping CRUD controller.
ix_load_board_configurations_provider_type=V1: Legacy load-board configuration singleton per provider; no current configuration CRUD controller.
ix_load_board_listings_external_listing_id_provider_type=V1: External load-board listing identity; no current listing CRUD controller.
ix_payment_links_token=V1: Generated payment-link token; no current payment-link CRUD controller.
ix_posted_trucks_truck_id_provider_type=V1: External posting association per truck/provider; no current posted-truck CRUD controller.
ix_telegram_chats_chat_id=V1: External Telegram chat identity; no current chat CRUD controller.
ix_terminals_code=V1: Legacy terminal code; no current terminal create/update controller. Require a field mapping if CRUD is introduced.
ix_tracking_links_token=V1: Generated tracking-link token; no current tracking-link CRUD controller.

# V9-V20 settlement/payroll command identities and generated ledger facts.
uq_shipment_costs_source=V9: Prevents duplicate synchronized cost facts by source type/id; command deduplication, not a standalone input.
settlements_settlement_number_key=V10: Settlement calculation generates the settlement number; not an entered CRUD field.
uq_settlements_original_driver_period=V10: One original calculation per driver/period; settlement command invariant.
uq_settlements_parent_sequence=V10: Generated adjustment sequence in settlement history; command/history invariant.
payroll_runs_run_number_key=V11: Payroll calculation generates the run number; not an entered CRUD field.
uq_payroll_items_run_driver_currency=V11: Generated payroll aggregation identity per run/driver/currency; command invariant.
uq_payroll_item_settlement=V11: Prevents consuming a settlement twice across payroll items; ledger command invariant.
payslips_payroll_run_item_id_key=V11: One immutable issued payslip per payroll item; issuance command invariant.
payroll_payments_idempotency_key_key=V11: Scheduling command idempotency; errors remain empty and the server message is shown.
uq_payroll_payment_attempt=V11: Generated payment attempt number per payroll item; immutable command history.
uq_settlements_parent_request=V13: Adjustment request idempotency within parent settlement; command conflict.
uq_settlements_one_reversal=V13: At most one reversal of a settlement; history command conflict.
employee_payroll_profiles_employee_id_profile_version_key=V14: appendProfile generates the next version while locking the employee; append-only command, not editable profileVersion.
payroll_policy_versions_policy_code_policy_version_key=V14: appendPolicy generates the next policy version; append-only version command, not an entered version identity.
uq_payroll_run_request=V14: Payroll calculation request idempotency; command conflict.
uq_payroll_item_active_payment=V17: At most one active payment attempt per item; scheduling command invariant.
payroll_payment_events_source_type_provider_key_source_key_key=V18: Verified provider event deduplication; callback command identity.
uq_payroll_event_resolution=V18: At most one resolution of a payment event; audited reconciliation command.
uq_payroll_bank_transaction=V19: A bank transaction can reconcile only once per provider/currency; reconciliation command identity.

# V21-V28 immutable rating and billing command chains.
customer_rating_contracts_id_customer_id_key=V21: Composite candidate key binds contract to customer for FK integrity; id is generated.
customer_rating_contract_vers_contract_id_contract_version__key=V21: Immutable contract-version identity for append-version commands.
load_pickup_business_date_changes_load_id_id_key=V22: Composite candidate key binds audit change to load; id is generated.
load_pickup_business_date_change_load_id_previous_change_id_key=V22: One successor in the pickup-date audit chain; stale command/history conflict.
accepted_rating_snapshots_operation_idempotency_key_key=V24: Rating acceptance command idempotency.
accepted_rating_snapshots_id_load_id_customer_id_currency_key=V24: Composite candidate key binds immutable snapshot to load/customer/currency; generated id.
ux_rated_primary_business_key=V26: One rated primary invoice per load/customer/currency; billing primary command invariant.
invoice_billing_commands_operation_idempotency_key_key=V26: Billing command idempotency; no input field error.
ux_invoice_one_rebill=V27: One rebill successor per parent invoice; signed billing history invariant.
settlement_revenue_commands_operation_request_key_key=V28: Settlement revenue recalculation/adjustment command idempotency.
settlement_billing_adjustments_command_id_key=V28: One adjustment fact per audited command; immutable command history.

# V30-V34 immutable optimization/fleet facts.
optimization_policy_versions_policy_code_policy_version_key=V30: Immutable optimization policy publication version identity; publish command.
optimization_runs_idempotency_key_key=V30: Optimization-run command idempotency.
optimization_assignments_run_id_load_id_trip_id_driver_id_t_key=V30: One generated candidate tuple per optimization run; immutable candidate facts.
optimization_assignments_id_run_id_key=V30: Composite candidate key binds assignment to its run for FK integrity; generated id.
optimization_qualified_inputs_supersedes_input_id_key=V32: One successor per qualified source input; immutable supersession chain.
optimization_acceptances_candidate_id_key=V33: Candidate may be accepted once; stale acceptance command conflict.
optimization_acceptances_load_id_key=V33: Load may have one accepted assignment; atomic acceptance command conflict.
optimization_acceptances_run_id_key=V33: Run may have one accepted candidate; atomic acceptance command conflict.
fleet_policy_versions_policy_code_policy_version_key=V34: Immutable fleet policy publication version identity; publish command.
vehicle_status_events_supersedes_event_id_key=V34: One successor per vehicle status event; immutable correction command chain.
vehicle_status_events_source_type_source_reference_source_v_key=V34: Vehicle status source-event deduplication; audited command identity.
fleet_mileage_attributions_supersedes_id_key=V34: One successor per mileage attribution; immutable correction command chain.
fleet_mileage_attributions_source_type_source_reference_sou_key=V34: Mileage source-event deduplication; audited command identity.
uq_fleet_trip_original_attribution=V34: One original mileage attribution per trip; immutable generated fact.

# V38-V39 payment audit and internal authentication mappings.
payment_command_events_payment_id_payment_version_key=V38: One immutable financial command event per generated payment version.
uq_lark_user_mappings_open_id=V39: Internal authentication binding to external Lark open_id; no mapping CRUD form.
uq_lark_user_mappings_union_id=V39: Internal authentication binding to external Lark union_id; no mapping CRUD form.
